[metadata]
name = pickleball-tracker
version = 0.1.0
description = Track a pickleball through recorded video.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.24
    opencv-python-headless>=4.10,<5
    PySide6>=6.7,<7

[options.extras_require]
test =
    pytest>=8.0,<9

[options.entry_points]
console_scripts =
    pickleball-tracker = pickleball_tracker.app:main

[options.packages.find]
where = src
